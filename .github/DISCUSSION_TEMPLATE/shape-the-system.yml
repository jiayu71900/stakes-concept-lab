title: "[Shape the system] "
body:
  - type: markdown
    attributes:
      value: |
        See an open edge worth shaping? Bring a question, a sketch, a code direction, or something you have already started. It does not need to be a finished proposal.
  - type: dropdown
    id: area
    attributes:
      label: Which part of the system do you want to shape?
      options:
        - Product behavior and interaction
        - Domain model and architecture
        - Trust, abuse, and verification
        - Discovery and ranking
        - Operations and community mechanics
        - A connection between several layers
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: What do you see?
      description: Bring a missing piece, an uncomfortable question, a rough direction, or something you have already started making.
    validations:
      required: true
  - type: textarea
    id: direction
    attributes:
      label: Where would you take it?
      description: What would you explore, change, or build next?
    validations:
      required: false
  - type: textarea
    id: closeness
    attributes:
      label: If it keeps moving, what part would you want to stay close to?
      description: A product question, system boundary, implementation, or community practice.
    validations:
      required: false
