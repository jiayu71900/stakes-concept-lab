title: "[Rule break] "
body:
  - type: markdown
    attributes:
      value: |
        Found a loophole, unfair edge, or strange behavior? Drop it here. Rough ideas are welcome — you do not need to have the solution.
  - type: textarea
    id: scenario
    attributes:
      label: What happened?
      description: Walk us through the situation in your own words.
    validations:
      required: true
  - type: textarea
    id: breakable
    attributes:
      label: Why does it feel breakable?
      description: Who benefits, who loses, or what starts feeling unfair?
    validations:
      required: false
  - type: textarea
    id: next
    attributes:
      label: What would you try next?
      description: A rule change, a signal to watch, or simply another question.
    validations:
      required: false
