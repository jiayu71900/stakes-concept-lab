title: "[Rule break] "
body:
  - type: markdown
    attributes:
      value: |
        Try to break the social system, not just the interface. Concrete abuse paths are useful even when the answer is still unknown.
  - type: input
    id: rule
    attributes:
      label: Which rule are you attacking?
      placeholder: For example, default cleaning or random discovery.
    validations:
      required: true
  - type: textarea
    id: actors
    attributes:
      label: Who is involved and what do they want?
      description: Name the actors, incentives, and any coordination between them.
    validations:
      required: true
  - type: textarea
    id: path
    attributes:
      label: Smallest reproducible abuse path
      description: Walk through the sequence from normal use to the unwanted outcome.
    validations:
      required: true
  - type: textarea
    id: signal
    attributes:
      label: What signal might reveal it?
    validations:
      required: false
  - type: textarea
    id: response
    attributes:
      label: What response would preserve the product principle?
      description: A good response should add resistance without quietly turning a default into a ban.
    validations:
      required: false
